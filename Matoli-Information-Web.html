        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;

        }

        .search-container {

            text-align: center;

        }

        .search-box {
            padding: 15px 20px;
            font-size: 1.1rem;

            border-radius: 50px;
            width: 100%;
            max-width: 400px;

        }

        .search-box:focus {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(0,0,0,0.15);
        }

        .fruits-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .fruit-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .fruit-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .fruit-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .fruit-card:hover::before {
            transform: scaleX(1);
        }

        .fruit-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .fruit-image {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-right: 15px;
            object-fit: cover;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            animation: bounce 2s infinite;
        }

        .fruit-image:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .fruit-title {
            font-size: 1.8rem;
            color: #2c3e50;
            font-weight: bold;
        }

        .fruit-scientific {
            font-style: italic;
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .fruit-description {
            margin-bottom: 20px;
            color: #34495e;
            font-size: 1rem;
        }

        .nutrition-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .nutrition-item {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .benefits {
            margin-top: 15px;
        }

        .benefits h4 {
            color: #2c3e50;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .benefits ul {
            list-style: none;
            padding-left: 0;
        }

        .benefits li {
            background: #ecf0f1;
            margin: 5px 0;
            padding: 8px 12px;
            border-radius: 15px;
            border-left: 4px solid #3498db;
            font-size: 0.9rem;
        }



        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        @media (max-width: 768px) {
            .fruits-grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .nutrition-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

        let currentFilter = 'all';

        function renderFruits() {
            const grid = document.getElementById('fruitsGrid');
            const filteredFruits = fruitsData.filter(fruit => {
                const matchesSearch = fruit.name.toLowerCase().includes(searchTerm.toLowerCase());
                return matchesSearch;
            });

            grid.innerHTML = filteredFruits.map(fruit => `
                <div class="fruit-card">
                    <div class="fruit-header">
                        <img src="${fruit.image}" alt="${fruit.name}" class="fruit-image" loading="lazy">
                        <div>
                            <div class="fruit-title">${fruit.name}</div>
                            <div class="fruit-scientific">${fruit.scientific}</div>
                        </div>
                    </div>
                    <div class="fruit-description">${fruit.description}</div>
                    <div class="nutrition-grid">
                        ${Object.entries(fruit.nutrition).map(([key, value]) => 
                            `<div class="nutrition-item">${key}: ${value}</div>`
                        ).join('')}
                    </div>
                    <div class="benefits">
                        <h4>Uses:</h4>
                        <ul>
                            ${fruit.benefits.map(benefit => `<li>${benefit}</li>`).join('')}
                        </ul>
                    </div>
                </div>
            `).join('');
        }

        // Search functionality
